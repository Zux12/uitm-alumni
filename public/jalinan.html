<style>
#ai-welcome{box-sizing:border-box;width:min(620px,calc(100% - 32px));max-height:90dvh;padding:0;border:1px solid #d8b96d80;border-radius:24px;background:#20102e;color:#fff;box-shadow:0 30px 100px #0008;overflow:auto}
#ai-welcome::backdrop{background:#100a20b8;backdrop-filter:blur(8px)}
.ai-welcome-inner{position:relative;isolation:isolate;overflow:hidden;padding:48px 38px 28px}
.ai-welcome-art{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(135deg,#20102e,#38214f 60%,#1d1736)}
.ai-welcome-art::before,.ai-welcome-art::after{content:"";position:absolute;width:420px;height:420px;border-radius:45%;filter:blur(45px);opacity:.45;animation:welcome-drift 14s ease-in-out infinite alternate}
.ai-welcome-art::before{background:#9255bc;top:-260px;right:-120px}
.ai-welcome-art::after{background:#bc8f48;bottom:-330px;left:-180px;animation-delay:-7s}
.ai-welcome-grid{position:absolute;inset:-50%;background:repeating-linear-gradient(90deg,transparent 0 70px,#ffffff06 71px 72px),repeating-linear-gradient(0deg,transparent 0 70px,#ffffff06 71px 72px);transform:rotate(-20deg);animation:welcome-grid 22s linear infinite}
#ai-welcome .ai-close{position:absolute;top:14px;right:14px;width:36px;height:36px;padding:0;border:1px solid #ffffff40;border-radius:50%;background:#ffffff12;color:white;font:24px/1 sans-serif;cursor:pointer}
.ai-welcome-brand{color:#e5ca8a;font:600 11px/1.5 sans-serif;letter-spacing:3px;margin:0 0 18px}
#ai-welcome h2{font:500 clamp(30px,6vw,44px)/1.12 Georgia,serif;margin:0 0 20px;color:#fff}
#ai-welcome p.ai-welcome-copy{font:16px/1.7 sans-serif;color:#eee6f4;margin:0 0 18px;text-align:left}
.ai-welcome-status{border-left:2px solid #d9bc79;background:#ffffff09;padding:12px 16px;font:13px/1.6 sans-serif;color:#e5d8ef}
.ai-welcome-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:26px}
#ai-welcome .ai-read{border:0;border-radius:30px;background:#eed8a3;color:#2a1737;padding:13px 22px;font:600 14px sans-serif;cursor:pointer}
#ai-welcome .ai-timer-toggle{background:transparent;border:0;color:#e9ddf1;text-decoration:underline;text-underline-offset:4px;font:12px/1.5 sans-serif;cursor:pointer;padding:8px 0}
.ai-welcome-progress{height:2px;background:#ffffff20;margin-top:24px}
#ai-welcome-progress-fill{height:100%;background:#dfc38b;width:100%;transition:width 1s linear}
#ai-welcome button:focus-visible{outline:3px solid #fff;outline-offset:4px}
@keyframes welcome-drift{to{transform:translate(65px,90px) rotate(100deg) scale(1.2)}}
@keyframes welcome-grid{to{translate:72px 0}}
@media(max-width:480px){.ai-welcome-inner{padding:48px 24px 24px}}
@media(prefers-reduced-motion:reduce){.ai-welcome-art::before,.ai-welcome-art::after,.ai-welcome-grid{animation:none}#ai-welcome-progress-fill{transition:none}}
</style>
